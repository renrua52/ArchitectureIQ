name: CI (manual)

on:
  workflow_dispatch:

jobs:
  sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify checkout
        run: |
          git status --short --branch
          git diff --check
          echo "Manual CI sanity check passed for ${GITHUB_SHA}"
