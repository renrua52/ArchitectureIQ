    candidates:
      - id: mlp_relu_d2_w16
        model:
          type: mlp
          depth: 2
          width: 16
          residual: false
          activations: [relu, relu]
          layer_norm: [false, false]
          leaky_relu_slope: 0.01
      - id: kan_d1_w8_g5_r2
        model:
          type: kan
          variant: efficient_spline_v1
          depth: 1
          width: 8
          grid_size: 5
          spline_order: 3
          grid_range: [-2.0, 2.0]
          base_activation: silu
