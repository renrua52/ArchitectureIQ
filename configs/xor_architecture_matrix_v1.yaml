matrix_id: xor-architecture-v1
family: synthetic_tabular_classification
dataset_constraints:
  input_dim: 2
  num_classes: 2
  rule_family: xor
shared_training:
  total_samples_seen: 8192
  batch_size: 32
  optimizer:
    type: Adam
    lr: 0.001
    weight_decay: 0.0
    betas: [0.9, 0.999]
  loss:
    loss_id: cross_entropy
comparisons:
