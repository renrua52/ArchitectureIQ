<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ArchitectureIQ browser outbox</title>
  </head>
  <body>
    <script>
      "use strict";

      const DB_NAME = "architecture_iq_feedback_v1";
      const DB_VERSION = 1;
      const STORE_NAME = "live_outboxes";
      const OUTBOX_KEY = "architecture_iq_live_outbox_v1";

      function send(type, fields = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...fields },
          "*",
        );
      }

      function setValue(value) {
        send("streamlit:setComponentValue", {
          value,
          dataType: "json",
        });
      }

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              database.createObjectStore(STORE_NAME);
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("open failed"));
          request.onblocked = () => reject(new Error("database upgrade blocked"));
        });
      }

      async function transact(mode, callback) {
        const database = await openDatabase();
        try {
          return await new Promise((resolve, reject) => {
            const transaction = database.transaction(STORE_NAME, mode);
            const store = transaction.objectStore(STORE_NAME);
            let value;
            transaction.oncomplete = () => resolve(value);
            transaction.onerror = () =>
              reject(transaction.error || new Error("transaction failed"));
            transaction.onabort = () =>
              reject(transaction.error || new Error("transaction aborted"));
            try {
              value = callback(store);
            } catch (error) {
              transaction.abort();
              reject(error);
            }
          });
        } finally {
          database.close();
        }
      }

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("request failed"));
        });
      }

      async function loadValue() {
        const database = await openDatabase();
        try {
          const transaction = database.transaction(STORE_NAME, "readonly");
          return await requestResult(
            transaction.objectStore(STORE_NAME).get(OUTBOX_KEY),
          );
        } finally {
          database.close();
        }
      }

      async function saveValue(value) {
        await transact("readwrite", (store) => {
          store.put(value, OUTBOX_KEY);
        });
      }

      async function clearValue() {
        await transact("readwrite", (store) => {
          store.delete(OUTBOX_KEY);
        });
      }

      function safeError(error) {
        if (error && typeof error.name === "string" && error.name) {
          return error.name;
        }
        return "IndexedDBError";
      }

      async function handleRender(args) {
        const requestId =
          args && typeof args.request_id === "string" ? args.request_id : "invalid";
        try {
          if (!args || args.operation === "load") {
            const value = await loadValue();
            setValue({
              request_id: requestId,
              status: value === undefined ? "empty" : "loaded",
              value: value === undefined ? null : value,
            });
            return;
          }
          if (args.operation === "save") {
            if (typeof args.value !== "string") {
              throw new TypeError("save value must be text");
            }
            await saveValue(args.value);
            setValue({ request_id: requestId, status: "saved", value: null });
            return;
          }
          if (args.operation === "clear") {
            await clearValue();
            setValue({ request_id: requestId, status: "cleared", value: null });
            return;
          }
          throw new TypeError("unsupported operation");
        } catch (error) {
          setValue({
            request_id: requestId,
            status: "error",
            error: safeError(error),
            value: null,
          });
        }
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") {
          return;
        }
        void handleRender(event.data.args || {});
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </body>
</html>
