# Per-model evaluation settings — 2026-09-02 protocol freeze (setter decision).
#
# Protocol:
# - Every reasoning model runs at its MAXIMUM reasoning tier.
# - No practical token/time cap: max_tokens 65536 where the endpoint accepts
#   it; deepseek-r1 endpoint ceiling is 64000 total context -> 32768 output.
# - Client timeout 7200s; relay-side 524s are retried automatically.
# - temperature 0.0; per-model concurrency 20; judge = final <answer> tag.
#
# Probe evidence (2026-09-02, against https://api.gpt.ge/v1 and openrouter):
# - reasoning_effort:"high" -> HTTP 200 on every gptge reasoning model.
# - gpt-4o rejects reasoning_effort (HTTP 400, non-reasoning model): no param.
# - thinking:{"type":"enabled"} is rejected by gpt-5.6-luna; reasoning_effort
#   is the only parameter accepted by ALL gptge reasoning models.
# - max_tokens 65536 accepted by gpt-4o, gpt-5.6-sol, claude-opus-5,
#   gemini-2.5-pro, glm-5.2, deepseek-v4-flash-0731, deepseek-v4-pro-0813.
# - Default effort is NOT verifiably max: gpt-5.6-sol answered 35/100 pilot
#   questions with reasoning_tokens=0 at default; claude usage reports no
#   reasoning detail at default (extended thinking likely off). Therefore all
#   default-effort pilot results were archived and re-run at effort=high.

providers:
  gptge:
    base_url: https://api.gpt.ge/v1
    concurrency: 20
    max_tokens: 65536
    models:
      gpt-5.6-sol:
        params: {reasoning_effort: high}
      gpt-5.6-luna:
        params: {reasoning_effort: high}
      gpt-4o:
        params: {}  # non-reasoning; reasoning_effort -> HTTP 400
      claude-opus-5:
        params: {reasoning_effort: high}
      claude-sonnet-5:
        params: {reasoning_effort: high}
      gemini-2.5-pro:
        params: {reasoning_effort: high}
      gemini-3.1-pro-preview-high:
        params: {reasoning_effort: high}  # "-high" is the highest relay variant; param kept explicit
      glm-5.2:
        params: {reasoning_effort: high}
      deepseek-v4-flash-0731:
        params: {reasoning_effort: high}
      deepseek-v4-pro-0813:
        params: {reasoning_effort: high}
  openrouter:
    base_url: https://openrouter.ai/api/v1
    concurrency: 20
    max_tokens: 65536
    models:
      deepseek/deepseek-r1:
        params:
          reasoning: {effort: high}
          max_tokens: 32768  # endpoint context ceiling 64000 incl. input
