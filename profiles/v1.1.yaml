profile: v1.1
schema_version: "1.0"

# V1 final rebuild profile (development name; renamed to v1.yaml at release).
# Changes vs v1: KAN removed; MLP activation fixed to ReLU (activations grid
# removed); layer_norm is a single global boolean sampled once per candidate
# set in code (candidates/sets.py), so it no longer appears here; budget pool
# reduced to the four benchmark tiers.

pools:
  dataset_families:
    - univariate_regression
    - multivariate_regression
    - bigram_lm
    - synthetic_tabular_classification
  model_types:
    - mlp
    - transformer_lm
    - gru_lm
  optimizers:
    - SGD
    - Adam
    - AdamW
    - RMSprop
    - Adagrad
  losses:
    univariate_regression:
      - mse
      - mse_l2
      - mse_l1
    multivariate_regression:
      - mse
      - mse_l2
      - mse_l1
    bigram_lm:
      - cross_entropy
      - cross_entropy_l2
      - cross_entropy_l1
    synthetic_tabular_classification:
      - cross_entropy
  question_types:
    - architecture_only
    - optimizer_only
    - loss_only
    - mixed
  num_choices: 2

dataset:
  family: univariate_regression
  domain: [0.0, 1.0]
  train_size: 256
  test_size: 256
  sampler:
    id: symbolic_expr
    max_depth: 3
    max_retries: 200

dataset_configs:
  univariate_regression:
    domain: [0.0, 1.0]
    train_size: 256
    test_size: 256
    sampler:
      id: symbolic_expr
      max_depth: 3
      max_retries: 200
  multivariate_regression:
    input_dims: [2, 3, 4, 5, 8]
    domain: [0.0, 1.0]
    train_size: 256
    test_size: 256
    sampler:
      id: symbolic_expr_mv
      max_depth: 3
      max_retries: 200
  bigram_lm:
    vocab_size: 32
    context_length: 16
    train_size: 800
    test_size: 200
    alpha: 1.0
    layout: lm
    fail_threshold: 4.0
  synthetic_tabular_classification:
    input_dims: [2, 4, 8, 16]
    rule_families: [smooth_additive, sparse_interaction, piecewise_boundary, xor, spiral]
    spiral_turns: 2.0
    active_feature_counts: [2, 3, 4]
    interaction_order: 2
    noise_std: [0.05, 0.1]
    train_size: 1024
    test_size: 2048
    calibration_size: 4096
    target_positive_rate: 0.5

mlp:
  depth: [1, 2, 3, 4, 5, 6]
  # Intermediate widths added for the v1 final rebuild (2026-08-23, user
  # decision): denser width ladder raises the share of cross-width
  # param-similar triples (width-vs-depth tradeoff questions). Only affects
  # newly sampled candidates; legacy 5-width candidates stay in the pool.
  width: [16, 24, 32, 48, 64, 96, 128, 192, 256]
  residual: [false, true]
  # Activations are fixed to ReLU (v1.1); the single-option grid is kept so
  # interactive tooling that enumerates profile choices keeps working.
  activations: [relu]
  # leaky_relu_slope is kept as a spec placeholder for backward compatibility
  # with legacy candidate specs.
  leaky_relu_slope: 0.01

transformer_lm:
  d_model: [32, 64, 128]
  num_layers: [1, 2, 3]
  num_heads: [2, 4]
  d_ff: [64, 128, 256]

gru_lm:
  d_model: [32, 64]
  num_layers: [1, 2]
  layer_residual: false

optimizer_grids:
  lr: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  weight_decay: [0, 1.0e-5, 1.0e-4, 1.0e-3]
  sgd_momentum: [0, 0.9]
  adam_betas: [0.9, 0.999]
  batch_size: [16, 32, 64]

loss_grids:
  lambda: [1.0e-4, 1.0e-3, 1.0e-2]

budgets:
  total_samples_seen: [2048, 4096, 8192, 16384]

training_defaults:
  synthetic_tabular_classification:
    batch_size: 32
    training_steps: 256
    total_samples_seen: 8192

ground_truth:
  n_seeds: 10
  base_seed: 0
  fail_threshold: 2.0
  max_failed_seeds: 3

significance:
  gap_min: 0.05
  win_rate_min: 0.7
  use_non_overlap: true

question_generation:
  max_attempts: 20
  targeted_pool_size: 32
  # Optional quality filters for generate-question (all off by default).
  # Enable here and/or override via CLI flags on generate-question.
  # quality:
  #   gap_max: 0.25              # reject winner–runner-up gaps above this
  #   gap_worst_max: 0.5         # reject winner–worst gaps above this
  #   require_finite_mean: true  # drop candidates with non-finite selection mean
  #   max_failed_seeds: 0        # drop candidates with more failed seeds than N

prompts:
  use_llm_paraphrase: false
  template_version: "1.0"

# The width grid grew from 5 to 9 tiers mid-supply (D13). Candidates rendered
# under the two earlier v1.1 hashes are legitimate samples of the final grid
# (old tiers are a subset), so they are explicitly allowlisted for reuse.
cross_profile_reuse:
  enabled: true
  transformer_allowlist:
    - source_profile: v1.1
      source_profile_hash: fe2eca16d4f87e01
      model_types: [mlp, transformer_lm, gru_lm]
    - source_profile: v1.1
      source_profile_hash: fdad4cc593883a24
      model_types: [mlp, transformer_lm, gru_lm]
