profile: v1_human
schema_version: "1.0"

# Mirror of the remote "ArchitectureIQ V1 · human pre-review" generation pool
# (remote profile_hash 90421abe32ec88c7). Used by the Inspector's custom
# settings so the adjustable model/optimizer/loss/budget pool matches the
# synced 250-question bank. Frozen historical profiles are not modified.
pools:
  dataset_families:
    - univariate_regression
    - synthetic_tabular_classification
    - bigram_lm
  model_types:
    - mlp
    - transformer_lm
    - kan
    - gru_lm
  optimizers:
    - SGD
    - Adam
    - AdamW
    - RMSprop
    - Adagrad
  losses:
    univariate_regression:
      - mse
      - mse_l2
      - mse_l1
    synthetic_tabular_classification:
      - cross_entropy
      - cross_entropy_l2
      - cross_entropy_l1
    bigram_lm:
      - cross_entropy
      - cross_entropy_l2
      - cross_entropy_l1
  question_types:
    - architecture_only
    - optimizer_only
    - loss_only
    - mixed
  num_choices: 3

model_gates:
  univariate_regression:
    compatible_model_types: [mlp, kan]
  synthetic_tabular_classification:
    compatible_model_types: [mlp, kan]
  bigram_lm:
    compatible_model_types: [gru_lm, transformer_lm]

dataset:
  family: univariate_regression
  train_size: 256
  test_size: 256

dataset_configs:
  univariate_regression:
    domain: [0.0, 1.0]
    train_size: 256
    test_size: 256
    sampler:
      id: symbolic_expr
      max_depth: 3
      max_retries: 200
  synthetic_tabular_classification:
    input_dims: [2]
    rule_families: [xor, spiral]
    active_feature_counts: [2]
    interaction_order: 2
    noise_std: [0.05, 0.1]
    train_size: 1024
    test_size: 2048
    calibration_size: 4096
    target_positive_rate: 0.5
  bigram_lm:
    vocab_size: 32
    context_length: 16
    train_size: 800
    test_size: 200
    alpha: 1.0
    layout: lm
    fail_threshold: 4.0

mlp:
  depth: [1, 2, 3, 4, 5, 6]
  width: [16, 32, 64, 128, 256]
  residual: [false, true]
  activations: [relu, leaky_relu, gelu, silu]
  leaky_relu_slope: 0.01

transformer_lm:
  d_model: [32, 64, 128]
  num_layers: [1, 2, 3]
  num_heads: [2, 4]
  d_ff: [64, 128, 256]

kan:
  variant: efficient_spline_v1
  depth: [1, 2]
  width: [8, 16]
  grid_size: [5, 7]
  spline_order: [3]
  grid_range: [[-1.0, 1.0], [-2.0, 2.0]]
  base_activation: [silu]

gru_lm:
  d_model: [16, 20, 24, 28, 32, 36, 40, 48, 56, 64, 72, 80, 96]
  num_layers: [1, 2, 3, 4, 5, 6, 7, 8]
  layer_residual: true

optimizer_grids:
  lr: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  weight_decay: [0, 1.0e-5, 1.0e-4, 1.0e-3]
  sgd_momentum: [0, 0.9]
  adam_betas: [0.9, 0.999]
  batch_size: [16, 32, 64]

loss_grids:
  lambda: [1.0e-4, 1.0e-3, 1.0e-2]

budgets:
  total_samples_seen: [1024, 2048, 4096, 8192, 16384]

ground_truth:
  n_seeds: 10
  base_seed: 0
  device: cpu
  fail_threshold: 2.0
  max_failed_seeds: 3

significance:
  gap_min: 0.05
  win_rate_min: 0.7
  use_non_overlap: true

question_generation:
  max_attempts: 20
  targeted_pool_size: 32
  non_repeating_candidates: false

prompts:
  use_llm_paraphrase: false
  template_version: "1.0"
